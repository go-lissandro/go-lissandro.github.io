  <text x="84" y="300" font-family="Inter, sans-serif" font-size="108" font-weight="800" letter-spacing="-2"><tspan fill="#e6e9f2">Lissandro </tspan><tspan fill="url(#gradNome)">Rocha</tspan></text>
  <text x="88" y="378" font-family="Inter, sans-serif" font-size="48" font-weight="600" fill="#e6e9f2">Desenvolvedor Full Stack</text>
